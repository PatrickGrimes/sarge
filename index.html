<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SARN'T</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">SARN'T</div>
      <div id="statusLine">LOADING</div>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Mute">🔊</button>
    </div>

    <section class="screen on" id="screen-wait">
      <div>
        <p class="eyebrow wait" id="waitEyebrow">FETCHING TODAY</p>
        <h1 id="waitTitle">STAND BY</h1>
        <p class="lede" id="waitCopy">SARN'T IS COLLECTING THIS MORNING'S ORDERS.</p>
      </div>
      <div class="actions">
        <button class="primary" id="retryBtn" type="button">TRY AGAIN</button>
      </div>
    </section>

    <section class="screen" id="screen-ready">
      <div>
        <p class="eyebrow" id="readyMeta"></p>
        <h1 id="readyTitle"></h1>
        <p class="lede" id="readyIntro"></p>
      </div>
      <div class="actions">
        <button class="primary" id="beginBtn" type="button">BEGIN</button>
        <button class="ghost" id="refreshBtn" type="button">REFRESH FROM REPO</button>
      </div>
    </section>

    <section class="screen" id="screen-work">
      <div>
        <p class="eyebrow" id="workProgress"></p>
        <div class="bar"><i id="workBar"></i></div>
        <h2 id="workName"></h2>
        <p class="lede" id="workCopy"></p>
        <div class="timer" id="workTimer" hidden>0:00</div>
        <div class="reps" id="workReps" hidden></div>
      </div>
      <div class="actions">
        <button class="primary" id="mainBtn" type="button">START</button>
        <button class="ghost" id="skipBtn" type="button">SKIP</button>
      </div>
    </section>

    <section class="screen" id="screen-done">
      <div>
        <p class="eyebrow">COMPLETE</p>
        <h1>DISMISSED</h1>
        <p class="lede" id="doneCopy"></p>
      </div>
      <div class="actions">
        <button class="primary" id="againBtn" type="button">RUN IT AGAIN</button>
        <button class="ghost" id="reloadBtn" type="button">LOAD TODAY AGAIN</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
